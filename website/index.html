<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155b45">
  <meta name="description" content="Baca Al-Qur'an digital lengkap dengan terjemahan bahasa Indonesia.">
  <title>Al-Qur'an Digital</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="/data/surah-list.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7@8.3.0/framework7-bundle.min.css">
  <style>
    #splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#155b45;color:#f3d98c;text-align:center}
    #splash .ar{font-size:32px;line-height:2}
    #splash .tx{color:#e4eee8;font-size:14px}
    .verse-card{content-visibility:auto;contain-intrinsic-size:auto 240px}
  </style>
</head>

<body>
  <div id="app">
    <div id="splash"><div class="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div class="tx">Memuat Al-Qur'an Digital...</div></div>
    <div class="view view-main view-init"></div>
  </div>

  <template id="home-tpl">
    <div class="page" data-name="home">
      <div class="page-content">

        <div class="block">
          <div>
            <div class="text-color-green" style="font-size:13px">ASSALAMUALAIKUM</div>
            <h2 class="margin-top-half margin-bottom-half">Al-Qur'an Digital</h2>
          </div>
        </div>

        <div class="block">
          <div class="card card-outline" style="background:#155b45;color:#fff;border-radius:18px">
            <div class="card-content card-content-padding">
              <div class="text-align-center">
                <div style="font-size:30px;color:#f3d98c">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                <h2>Mulai Membaca</h2>
                <p style="color:#e4eee8">Temukan ketenangan dalam setiap ayat Al-Qur'an.</p>
                <a href="/surah/1/" class="button button-fill"
                   style="background:#e6c779;color:#155b45;border-radius:10px">Baca Al-Fatihah</a>
              </div>
            </div>
          </div>
        </div>

        <div class="block">
          <div class="row align-items-center">
            <div class="col"><h3 class="margin-vertical-half">Daftar Surah</h3></div>
            <div class="col-auto"><span id="surah-total" class="text-color-gray">Memuat...</span></div>
          </div>
          <div class="searchbar searchbar-inline">
            <div class="searchbar-input-wrap">
              <input type="search" id="surah-search" placeholder="Cari nama surah...">
              <i class="searchbar-icon"></i>
              <span class="input-clear-button"></span>
            </div>
          </div>
        </div>

        <div class="list media-list inset margin-top">
          <ul id="surah-list">
            <li><div class="item-content"><div class="item-inner"><div class="item-title">Memuat daftar surah...</div></div></div></li>
          </ul>
        </div>

        <div id="home-error" class="block text-align-center text-color-red"></div>
        <div class="block text-align-center text-color-gray"><p>Al-Qur'an Digital</p></div>

      </div>
    </div>
  </template>

  <script defer src="https://cdn.jsdelivr.net/npm/framework7@8.3.0/framework7-bundle.min.js"></script>
  <script defer src="/app.js"></script>
</body>
</html>
