
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#064e3b">
  <meta name="description" content="Baca Al-Qur'an digital lengkap dengan terjemahan, tafsir, dan audio murottal.">
  <title>Al-Qur'an Digital</title>

  <!-- Framework7 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7@8.3.0/framework7-bundle.min.css">
</head>

<body>
  <div id="app">
    <div class="view view-main view-init">
      <div class="page" data-name="home">

        <!-- Navbar -->
        <div class="navbar">
          <div class="navbar-bg"></div>
          <div class="navbar-inner">
            <div class="title">Al-Qur'an Digital</div>
          </div>
        </div>

        <!-- Konten -->
        <div class="page-content">

          <div class="block text-align-center">
            <h2>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h2>
            <p>Temukan ketenangan dalam membaca Al-Qur'an</p>
          </div>

          <div class="block-title">Daftar Surah</div>

          <div class="list">
            <ul id="surah-list">
              <li class="item-content">
                <div class="item-inner">
                  <div class="item-title">
                    Memuat daftar surah...
                  </div>
                </div>
              </li>
            </ul>
          </div>

        </div>

        <!-- Navigasi bawah -->
        <div class="toolbar toolbar-bottom tabbar">
          <div class="toolbar-inner">

            <a href="/" class="tab-link tab-link-active">
              <span class="tabbar-label">Beranda</span>
            </a>

            <a href="/bookmark/" class="tab-link">
              <span class="tabbar-label">Bookmark</span>
            </a>

            <a href="/pengaturan/" class="tab-link">
              <span class="tabbar-label">Pengaturan</span>
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Framework7 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/framework7@8.3.0/framework7-bundle.min.js"></script>

  <!-- Inisialisasi Framework7 -->
  <script>
    const app = new Framework7({
      el: '#app',
      name: "Al-Qur'an Digital",
      theme: 'md'
    });
  </script>

  <!-- JavaScript aplikasi -->
  <script src="app.js"></script>

</body>
</html>
