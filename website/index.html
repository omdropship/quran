
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155b45">
  <meta name="description" content="Baca Al-Qur'an digital lengkap dengan terjemahan bahasa Indonesia.">
  <title>Al-Qur'an Digital</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7@8.3.0/framework7-bundle.min.css">
</head>

<body>
  <div id="app">
    <div class="view view-main view-init" data-url="/">
      <div class="page" data-name="home">
        <div class="page-content">

          <div class="block">
            <div class="display-flex justify-content-space-between align-items-center">
              <div>
                <div class="text-color-green" style="font-size:13px">
                  ASSALAMUALAIKUM
                </div>
                <h2 class="margin-top-half margin-bottom-half">
                  Al-Qur'an Digital
                </h2>
              </div>
              <a href="#" class="panel-open" data-panel="left">
                <i class="f7-icons">line_horizontal_3</i>
              </a>
            </div>
          </div>

          <div class="block">
            <div class="card card-outline" style="background:#155b45;color:#fff;border-radius:18px">
              <div class="card-content card-content-padding">
                <div class="text-align-center">
                  <div style="font-size:30px;color:#f3d98c">
                    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
                  </div>
                  <h2>Mulai Membaca</h2>
                  <p style="color:#e4eee8">
                    Temukan ketenangan dalam setiap ayat Al-Qur'an.
                  </p>
                  <a href="/surah/1/" class="button button-fill"
                     style="background:#e6c779;color:#155b45;border-radius:10px">
                    Baca Al-Fatihah
                  </a>
                </div>
              </div>
            </div>
          </div>

          <div class="block">
            <div class="row align-items-center">
              <div class="col">
                <h3 class="margin-vertical-half">Daftar Surah</h3>
              </div>
              <div class="col-auto">
                <span id="surah-total" class="text-color-gray">Memuat...</span>
              </div>
            </div>

            <div class="searchbar searchbar-inline">
              <div class="searchbar-input-wrap">
                <input type="search" id="surah-search" placeholder="Cari nama surah...">
                <i class="searchbar-icon"></i>
                <span class="input-clear-button"></span>
              </div>
            </div>
          </div>

          <div class="list media-list inset margin-top">
            <ul id="surah-list">
              <li>
                <div class="item-content">
                  <div class="item-inner">
                    <div class="item-title">Memuat daftar surah...</div>
                  </div>
                </div>
              </li>
            </ul>
          </div>

          <div id="home-error" class="block text-align-center text-color-red"></div>

          <div class="block text-align-center text-color-gray">
            <p>Al-Qur'an Digital</p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/framework7@8.3.0/framework7-bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
