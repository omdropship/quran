<script src="https://cdn.jsdelivr.net/npm/framework7@8.3.0/framework7-bundle.min.js"></script>

<script>
  const app = new Framework7({
    el: '#app',
    name: "Al-Qur'an Digital",
    theme: 'md',
    routes: [
      {
        path: '/surah/:number/',
        async: async ({ to, resolve, reject }) => {
          try {
            const response = await fetch('./data/quran.json');
            const result = await response.json();

            const surahs = Array.isArray(result)
              ? result
              : result.data;

            const surah = surahs.find(
              item => Number(item.number) === Number(to.params.number)
            );

            if (!surah) {
              reject();
              return;
            }

            const page = `
              <div class="page" data-name="surah">
                <div class="navbar">
                  <div class="navbar-bg"></div>
                  <div class="navbar-inner">
                    <div class="left">
                      <a href="#" class="link back">
                        <i class="icon icon-back"></i>
                      </a>
                    </div>
                    <div class="title">
                      ${surah.name?.transliteration?.id || 'Baca Surah'}
                    </div>
                  </div>
                </div>
                <div class="page-content">
                  <div class="block text-align-center">
                    <h2>${surah.name?.short || ''}</h2>
                    <p>${surah.numberOfVerses} ayat</p>
                  </div>
                  <div id="ayat-list" class="list simple-list">
                    <ul>
                      ${surah.verses.map(ayat => `
                        <li style="display:block; padding:20px 16px;">
                          <div>${ayat.number?.inSurah || ayat.number || ''}</div>
                          <h2 style="text-align:right; line-height:2;">
                            ${ayat.text?.arab || ''}
                          </h2>
                          <p>${ayat.translation?.id || ''}</p>
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                </div>
              </div>
            `;

            resolve({ content: page });
          } catch (error) {
            console.error(error);
            reject();
          }
        }
      }
    ]
  });
</script>

<script src="app.js"></script>
