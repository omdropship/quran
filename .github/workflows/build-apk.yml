
name: Build AyatNusa Android

on:
  workflow_dispatch:
    inputs:
      include_tafsir:
        description: "Sertakan tafsir offline (memperbesar ukuran aplikasi)"
        required: true
        type: boolean
        default: false
      site_url:
        description: "Website AyatNusa"
        required: true
        type: string
        default: "https://quran254.vercel.app"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Quran data
        run: node scripts/build-data.js

      - name: Prepare lightweight website
        run: |
          mkdir -p cap/www/data/surah
          mkdir -p cap/www/lib

          cp website/index.html cap/www/
          cp website/app.js cap/www/
          cp website/data/surah-list.json cap/www/data/
          cp website/data/surah/*.json cap/www/data/surah/

          if [ "${{ inputs.include_tafsir }}" = "true" ]; then
            mkdir -p cap/www/data/tafsir
            cp website/data/tafsir/*.json cap/www/data/tafsir/
          fi

          # Memperkecil ukuran JSON tanpa mengubah isi datanya
          node -e '
            const fs = require("fs");
            const path = require("path");

            function compact(file) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              fs.writeFileSync(file, JSON.stringify(data));
            }

            compact("cap/www/data/surah-list.json");

            for (const file of fs.readdirSync("cap/www/data/surah")) {
              if (file.endsWith(".json")) {
                compact(path.join("cap/www/data/surah", file));
              }
            }

            if (fs.existsSync("cap/www/data/tafsir")) {
              for (const file of fs.readdirSync("cap/www/data/tafsir")) {
                if (file.endsWith(".json")) {
                  compact(path.join("cap/www/data/tafsir", file));
                }
              }
            }
          '

      - name: Install Framework7
        run: |
          cd cap
          npm init -y
          npm install framework7@8.3.0 --no-audit --no-fund

          cp node_modules/framework7/framework7-bundle.min.js www/lib/
          cp node_modules/framework7/framework7-bundle.min.css www/lib/

      - name: Configure website
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          cd cap/www

          node -e '
            const fs = require("fs");
            const u = new URL(process.env.SITE_URL);

            if (u.protocol !== "https:") {
              throw new Error("Website harus menggunakan HTTPS");
            }

            let html = fs.readFileSync("index.html", "utf8");

            html = html.replace(
              "</head>",
              "<script>window.QURAN_REMOTE = " +
              JSON.stringify(u.origin) +
              ";</script></head>"
            );

            fs.writeFileSync("index.html", html);
          '

      - name: Create Capacitor project
        run: |
          cd cap

          npm install --no-audit --no-fund \
            @capacitor/core@6.1.2 \
            @capacitor/cli@6.1.2 \
            @capacitor/android@6.1.2

          npx cap init AyatNusa com.ayatnusa --web-dir www
          npx cap add android

      - name: Generate Android launcher icon
        run: |
          cd cap

          npm install --no-save --no-audit --no-fund \
            @capacitor/assets@3 sharp

          mkdir -p assets
          cp ../assets/icon.png assets/icon.png

          npx capacitor-assets generate --android

      - name: Set app name
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">AyatNusa</string>|' \
            cap/android/app/src/main/res/values/strings.xml

      - name: Enable Android release optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("cap/android/app/build.gradle")
          s = p.read_text()

          if "minifyEnabled false" not in s:
              raise SystemExit("Pengaturan minifyEnabled tidak ditemukan. Build dihentikan.")

          s = s.replace(
              "minifyEnabled false",
              "minifyEnabled true\n            shrinkResources true",
              1
          )

          p.write_text(s)
          PY

      - name: Sync Android
        run: |
          cd cap
          npx cap sync android

      - name: Build APK and AAB
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyatNusa-APK
          path: cap/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AyatNusa-AAB
          path: cap/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
